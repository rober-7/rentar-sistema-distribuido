services:
  db:
    image: postgres:16
    container_name: rentar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rentar
      POSTGRES_PASSWORD: rentar
      POSTGRES_DB: rentar_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentar -d rentar_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: rentar_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  vehicle_service:
    build:
      context: ./services/vehicle-service
      dockerfile: Dockerfile
    container_name: rentar_vehicle_service
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: rentar
      DB_PASSWORD: rentar
      DB_NAME: rentar_db
      GRPC_PORT: 50051
    volumes:
      - ./services/vehicle-service:/app
      - ./proto:/app/proto
    depends_on:
      db:
        condition: service_healthy

  customer_service:
    build:
      context: ./services/customer-service
      dockerfile: Dockerfile
    container_name: rentar_customer_service
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: rentar
      DB_PASSWORD: rentar
      DB_NAME: rentar_db
      GRPC_PORT: 50052
    volumes:
      - ./services/customer-service:/app
      - ./proto:/app/proto
    depends_on:
      db:
        condition: service_healthy

  rental_service:
    build:
      context: ./services/rental-service
      dockerfile: Dockerfile
    container_name: rentar_rental_service
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: rentar
      DB_PASSWORD: rentar
      DB_NAME: rentar_db
      GRPC_PORT: 50053
    volumes:
      - ./services/rental-service:/app
      - ./proto:/app/proto
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentar_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./proto:/app/proto
    env_file:
      - ./backend/.env
    environment:
      VEHICLE_SERVICE_URL: vehicle_service:50051
      CUSTOMER_SERVICE_URL: customer_service:50052
      RENTAL_SERVICE_URL: rental_service:50053
    depends_on:
      db:
        condition: service_healthy
      vehicle_service:
        condition: service_started
      customer_service:
        condition: service_started
      rental_service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rentar_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
